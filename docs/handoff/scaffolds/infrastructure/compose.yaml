# Disposable developer database only. Explicit immutable image and secret inputs are required.
services:
  postgres:
    image: "${POSTGRES_IMAGE:?Set a reviewed postgres image with an immutable sha256 digest}"
    environment:
      POSTGRES_DB: workspace_dev
      POSTGRES_USER: workspace_owner
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a unique local development password}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - workspace_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_owner -d workspace_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  workspace_postgres: {}
