[workspace]
resolver = "2"
members = ["crates/domain", "crates/local-store", "crates/broker", "apps/desktop"]
default-members = ["crates/domain", "crates/local-store", "crates/broker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
