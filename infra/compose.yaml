# Development only. The simulator needs no database.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: benk
      POSTGRES_USER: benk
      POSTGRES_PASSWORD: ${BENK_POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - benk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benk -d benk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  benk-postgres:
